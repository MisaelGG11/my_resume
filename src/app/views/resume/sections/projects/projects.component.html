<div>
  <h2 class="text-3xl font-bold mb-8 bg-gradient-to-r from-white via-sky-500 to-slate-500 animate-text bg-clip-text text-transparent">{{ 'mainProjects.title' | translate }}</h2>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    @for(project of mainProjects(); track project.id) {
      <project-card
        [id]="project.id"
        [imageUrl]="project.imageUrl"
        [title]="project.title"
        [description]="project.description"
        [liveDemoUrl]="project.liveDemoUrl"
        [repositoryUrl]="project.repositoryUrl"
        [technologies]="project.technologies"
      />
    }
  </div>
  <div class="mt-8 flex justify-center">
    <a href="#" class="space-x-1 relative font-semibold text-white flex items-center cursor-pointer underline-hover">
      {{ 'mainProjects.moreProjects' | translate }}
      <svg width="1.4rem" height="1.4rem" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#ffffff">
        <g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
        <g id="SVGRepo_iconCarrier">
          <path d="M6 12H18M18 12L13 7M18 12L13 17" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        </g>
      </svg>
    </a>
  </div>
</div>
