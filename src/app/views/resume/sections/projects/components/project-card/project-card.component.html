<div
  class="relative flex items-center justify-center"
  [ngClass]="{
    'w-full md:w-1/2': id === 3
  }"
>
  <img
    class="h-full object-cover"
    [src]="imageUrl"
    [alt]="'Project ' + title"
  />
  @if(liveDemoUrl || repositoryUrl) {
  <div
    class="absolute inset-0 bg-black/60 flex items-center justify-center gap-3 transition-opacity duration-300 hover:opacity-100 opacity-0"
  >
    @if(liveDemoUrl) {
    <a
      class="py-1 px-2.5 flex items-center gap-2 bg-sky-500 text-white rounded-full hover:bg-sky-400"
      [href]="liveDemoUrl"
      target="_blank"
    >
      <span class="material-symbols-outlined !text-base">visibility</span>
      <span class="text-sm">Demo</span>
    </a>
    } @if(repositoryUrl) {
    <a
      class="py-1 px-2.5 flex items-center gap-2 bg-[#090c2f] text-white rounded-full hover:bg-[#0d113b]"
      [href]="repositoryUrl"
      target="_blank"
    >
      <span class="material-symbols-outlined !text-base">folder_code</span>
      <span class="text-sm">Código</span>
    </a>
    }
  </div>
  }
</div>
<div
  class="flex flex-col p-7"
  [ngClass]="{
    'w-full md:w-1/2': id === 3
  }"
>
  <h3 class="text-lg font-bold text-sky-500">{{ title }}</h3>
  <p class="text-pretty text-sm sm:text-medium tracking-wide text-white mt-2">
    {{ description }}
  </p>

  <ul class="flex flex-wrap gap-2 mt-6">
    @for(tech of technologies; track tech) {
    <li
      class="text-xs leading-5 font-medium text-sky-600 dark:text-sky-400 bg-sky-400/10 rounded-full py-0.4 px-2.5 flex items-center hover:bg-sky-400/20"
    >
      {{ tech }}
    </li>
    }
  </ul>
</div>
