<div>
  <h2
    class="text-3xl font-bold mb-8 bg-gradient-to-r from-white via-sky-500 to-slate-500 animate-text bg-clip-text text-transparent"
  >
    Experiencia
  </h2>

  <div class="flex flex-col gap-8">
    @for(exp of experience(); track $index) {
      <experience-card
        [position]="exp.position"
        [company]="exp.company"
        [fechaInicio]="exp.fechaInicio"
        [fechaFin]="exp.fechaFin!"
        [functions]="exp.functions"
      />
    }
  </div>

</div>
