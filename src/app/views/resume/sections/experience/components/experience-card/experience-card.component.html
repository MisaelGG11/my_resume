<article class="bg-[#090c2f] shadow-xl overflow-hidden rounded-xl">
  <header class="bg-gradient-to-r from-blue-900/50 to-purple-900/50">
    <div
      class="flex flex-col md:flex-row items-center justify-between gap-4 p-6"
    >
      <div class="flex flex-col sm:flex-row items-center gap-4">
        <div class="bg-white/10 p-1.5 rounded-lg">
          <img
            src="assets/images/logos/secretaria.png"
            alt="Experiencia"
            class="h-14 w-14 object-contain"
            style="filter: brightness(200)"
          />
        </div>
        <div class="text-center md:text-start">
          <h2
            class="text-lg sm:text-xl md:text-2xl text-blue-400 font-semibold"
          >
            {{ position }}
          </h2>
          <span class="text-gray-300 mt-1 text-xs sm:text-sm">{{
            company
          }}</span>
        </div>
      </div>
      <span
        class="capitalize cursor-default text-xs leading-5 font-medium w-fit text-sky-600 dark:text-sky-400 bg-sky-400/10 rounded-full py-0.5 px-2.5 flex items-center hover:bg-sky-400/20"
      >
        {{ initDate | localizedDate : "MMM yyyy" }} -
        {{
          endDate
            ? (endDate | localizedDate : "MMM yyyy")
            : ("experience.present" | translate)
        }}
      </span>
    </div>
  </header>
  <div class="py-6 px-6 md:px-8 md:py-8 text-white">
    <ul class="list-disc list-outside space-y-2 text-sm sm:text-medium">
      @for(function of functions; track $index) {
      <li class="flex gap-3">
        <span class="material-symbols-outlined text-blue-400">{{
          function.icon
        }}</span>
        <p
          class="text-pretty text-sm"
          [innerHTML]="
            function.description | highlight : function.highlightedWords
          "
        ></p>
      </li>
      }
    </ul>
  </div>
</article>
